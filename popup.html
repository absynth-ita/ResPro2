<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 240px;
    background: #0d1117;
    color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 12px;
    padding: 14px;
  }
  .title  { font-weight: 600; font-size: 13px; color: #3fb950; margin-bottom: 3px; }
  .sub    { font-size: 10px; color: #484f58; margin-bottom: 14px; line-height: 1.4; }
  button  {
    width: 100%;
    background: #238636; border: none; border-radius: 7px;
    color: #fff; font-size: 12px; font-weight: 600;
    padding: 9px; cursor: pointer; font-family: inherit;
    transition: background .15s; margin-bottom: 8px;
  }
  button:hover { background: #2ea043; }
  .status {
    font-size: 11px; color: #484f58; text-align: center;
    margin-top: 6px; min-height: 16px;
  }
  .status.ok  { color: #3fb950; }
  .status.err { color: #f85149; }
</style>
</head>
<body>
  <div class="title">ResPro</div>
  <div class="sub">MyAccess BH · Assegnazione automatica responsibility</div>

  <button id="btn-inject">Apri pannello su questa pagina</button>

  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
